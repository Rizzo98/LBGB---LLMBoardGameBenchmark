# Dependency policy (PRD-v2 FR-16.1 to FR-16.4, SC-11).
#
# The engine is dependency-free and stays that way. 'lgbg/core' and 'lgbg/games' import the
# standard library and each other and nothing else, which is what makes a record readable by a
# machine that has this repository and nothing else, and what keeps a game plugin a data
# declaration rather than a stack. The boundary is a test, not a convention:
# tests/tooling/test_dependency_boundary.py fails the build the moment it erodes.
#
# Everything below is a v2 transport, agent or runner dependency. Each is pinned to one exact
# version, because a benchmark cannot tolerate a client library changing between two runs it
# means to compare, and each is justified here (FR-16.2):
#
#   mcp==1.30.0      The official MCP Python SDK (FR-16.3). The protocol is not reimplemented -
#                    a hand-rolled one is a maintenance liability with no benchmark value. The
#                    1.x line rather than 2.x, whose additions (OpenTelemetry tracing, JWT auth,
#                    multipart upload, a second JSON Schema implementation) are dependencies
#                    with no benchmark value; every one of them is another version that could
#                    change the request path between two models (FR-16.4).
#   uvicorn==0.54.0  The ASGI server for the HTTP host (FR-2.7). Routing is written directly
#                    against the ASGI interface, so no web framework is bought here - only the
#                    server, which is the one transport dependency FR-2.7 allows.
#   httpx==0.28.1    The HTTP client the OpenRouter adapter speaks through (FR-5.2). OpenRouter
#                    is OpenAI-compatible over HTTP, so a typed client is the whole of what the
#                    adapter needs. A vendor SDK would carry its own retry and repair policy,
#                    which FR-5.5 forbids and which would be invisible in the manifest.
#
# No dependency may carry game logic or model logic (FR-16.4), and no test may need a network or
# a key (NFR-8): the mock provider is what the suite drives.
#
# Development tooling, unchanged from v1 and pinned by uv.lock: ruff (lint and format), mypy
# (types, strict), pytest and pytest-cov (tests and coverage). None of them runs in a game.

[project]
name = "lgbg"
version = "0.1.0"
description = "LBGB - LLM Board Game Benchmark: game engine core and verifiable replay"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "mcp==1.30.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.uv]
# The library is used from the repository root, not installed as a distribution.
package = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"
# Documents are normative and their code samples are illustrative: never touch them.
extend-exclude = ["*.md", "prd", "kanban"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "S",   # flake8-bandit
    "RUF", # ruff-specific
    "TID", # flake8-tidy-imports
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Ambient randomness is unreproducible. Inject a RandomSource from lgbg.core.rng instead (PRD-v1 FR-2.1, FR-2.7)."

[tool.ruff.lint.per-file-ignores]
# The one module permitted to seed a local random.Random (ARCHITECTURE.md section 5.4).
"lgbg/core/rng.py" = ["TID251", "S311"]
# The fuzz driver owns a seeded driver RNG, separate from the game RNG (PRD-v1 FR-22.1).
"lgbg/adapters/**" = ["TID251", "S311"]
"scripts/**" = ["TID251", "S311"]
"tests/**" = ["S101", "TID251", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["lgbg", "tests", "scripts"]
