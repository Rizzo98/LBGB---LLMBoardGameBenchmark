name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    # NFR-3: no platform-specific code paths, so the gate runs on all three.
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the pinned environment
        run: uv sync --locked
      - name: Tooling gate (lint, format, types, tests)
        run: uv run python scripts/gate.py
